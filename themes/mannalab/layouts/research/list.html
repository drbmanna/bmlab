{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>Research</h1>
    <p>From systems to atoms. We ask the who, what, why, and how.</p>
  </div>
</div>
<section class="section">
  <div class="container">
    {{ range hugo.Data.research }}
    <div class="research-block">
      <div class="research-block-head">
        <div class="card-icon">{{ .icon | safeHTML }}</div>
        <h2>{{ .title }}</h2>
      </div>
      <p class="research-desc">{{ .description }}</p>
      {{ with .methods }}
      <div class="method-tags">
        {{ range . }}<span class="method-tag">{{ . }}</span>{{ end }}
      </div>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
