<nav class="nav">
  <div class="container">
    <div class="nav-inner">
      <a href="{{ "/" | relURL }}" class="nav-brand">BM<span>Lab</span></a>
      <button class="nav-toggle" aria-label="Toggle menu" onclick="this.nextElementSibling.classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links">
        {{ range .Site.Menus.main }}
          {{ if eq .Name "Join Us" }}
            <a href="{{ .URL }}" class="nav-join{{ if eq $.RelPermalink .URL }} active{{ end }}">{{ .Name }}</a>
          {{ else }}
            <a href="{{ .URL }}"{{ if eq $.RelPermalink .URL }} class="active"{{ end }}>{{ .Name }}</a>
          {{ end }}
        {{ end }}
      </div>
    </div>
  </div>
</nav>
