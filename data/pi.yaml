about: |
  Bharat grew up in Mahishadal, West Bengal. During his B.Tech. in Biotechnology, he developed a
  strong interest in computational biology. He later transitioned into bioinformatics for his
  M.Tech. studies, graduating with a gold medal. He subsequently pursued Ph.D. at IIT Kharagpur,
  where his doctoral research employed atomistic molecular dynamics simulations to investigate how
  ionic liquids deconstruct lignocellulosic biomass for biofuel production. During this period, his
  research interests expanded toward applying computational methods beyond single-molecule systems
  to the study of complex microbial communities. He pursued this direction further as a
  postdoctoral researcher at the University of Auckland, where he spent three years developing and
  applying multi-omics pipelines to investigate environmental microbiomes, with a particular focus
  on oxidative stress, microbial metabolism, and the evolution of antimicrobial resistance in
  complex microbial communities. He started his independent career in 2026 at VIT Vellore, bringing
  together his expertise in molecular simulations and systems-level microbial biology under one
  theme: From Systems to Atoms.

  Outside of research, Bharat enjoys travelling, cooking, theatre acting, and spending quality time
  with his family.

