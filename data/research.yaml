- title: "Oxidative Stress Biology"
  summary: "How cells sense and respond to reactive oxygen species. We model redox networks, protein oxidation, and stress-response regulation in bacteria and yeast."
  description: "Reactive oxygen species (ROS) are inevitable byproducts of aerobic metabolism and environmental stressors. We build computational models of how microbial cells sense, signal, and recover from oxidative damage — integrating protein-level structural changes with network-level regulatory responses. Current focus includes thiol-based redox switches, Hsp70 chaperone dynamics under oxidative load, and transcriptional rewiring in E. coli and S. cerevisiae."
  methods:
    - Molecular dynamics simulations
    - Redox proteomics analysis
    - Gene regulatory network modelling
    - Comparative genomics
