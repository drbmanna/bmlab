- title: "Microbial Ecology Across Environments"
  description: "Microbial communities drive biogeochemical cycles in every habitat on the planet. We study community assembly, functional potential, and species interactions across wastewater, soil, marine, and host-associated microbiomes. Our work asks a common set of questions regardless of the environment: who is there, what are they doing, and what shapes their response to perturbation?"
  methods:
    - 16S/Shotgun metagenomics
    - Community ecology
  icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>'

- title: "Oxidative Stress and Microbiome Engineering"
  description: "Reactive oxygen species (ROS) reshape microbial physiology, from gene regulation to community structure. We study how oxidative stress rewires metabolism in microbial communities and use that understanding to engineer better outcomes in bioremediation, contaminant degradation, and waste-to-resource recovery. Current work focuses on redox-driven selection pressures in engineered biological systems and their downstream effects on process performance."
  methods:
    - Redox biology
    - Bioremediation
    - Resource recovery
    - Wastewater treatment
  icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>'

- title: "Gut Microbiome and Human Health"
  description: "The gut microbiome is deeply tied to host metabolism, immunity, and disease. Conceptually, we treat the human gut as a host-regulated bioreactor: diet, host physiology, and metabolic state act as selection pressures that shape microbial composition and functional output, much like influent chemistry and redox conditions govern community dynamics in engineered systems. We apply computational approaches to characterise microbial shifts associated with metabolic disorders, inflammatory conditions, and antimicrobial exposure, with the goal of identifying microbial signatures and metabolic control points that distinguish disease from health."
  methods:
    - 16S/Shotgun metagenomics
    - Metabolomics
    - Host-microbe interactions
  icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'

- title: "Antimicrobial Resistance: A One Health Perspective"
  description: "Resistance genes do not respect boundaries between clinics, farms, and the environment. We track the emergence, horizontal transfer, and persistence of antimicrobial resistance determinants across human, animal, and environmental reservoirs. Our work spans pure-culture genomics to community-level resistome profiling in complex microbiomes, always asking what accelerates spread and where intervention is most effective."
  methods:
    - Resistome profiling
    - Whole-genome sequencing
    - Pan-genome analysis
    - Metagenomics
  icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'

- title: "Multi-omics Integration"
  description: "Biology has moved beyond studying one molecular layer at a time. Genome, transcriptome, proteome, and metabolome interact and contradict each other in ways that only become visible when analysed together. We apply multi-omics integration to ask how microbial communities regulate their physiology under stress, how metabolic functions shift across environmental gradients, and where the real control points sit. Our strength is in combining existing tools to frame the right question and extract interpretable biology from high-dimensional data."
  methods:
    - Metagenomics
    - Metatranscriptomics
    - Metaproteomics
    - Metabolomics
    - Genome-scale metabolic modelling
  icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/><line x1="5" y1="19" x2="19" y2="19"/></svg>'

- title: "Biomolecular Structure and Dynamics"
  description: "Biological function ultimately rests on molecular structure. We use all-atom molecular dynamics simulations to study how proteins, enzymes, carbohydrates, lignin, and synthetic polymers behave at atomic resolution, asking how mutations alter catalysis and how small molecules bind or stabilise their targets. Alongside classical MD, we integrate AI-driven structure prediction and diffusion-based generative models for ligand docking and de novo protein design."
  methods:
    - AMBER/NAMD
    - Free energy calculations
    - AlphaFold2/ESMFold
    - DiffDock
    - RFDiffusion
    - Protein engineering
  icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="18" r="2"/><line x1="6" y1="7" x2="10" y2="10"/><line x1="18" y1="7" x2="14" y2="10"/><line x1="6" y1="17" x2="10" y2="14"/><line x1="18" y1="17" x2="14" y2="14"/></svg>'
