- title: "Antimicrobial Resistance Evolution"
  summary: "Using population genomics and phylogenomics to trace how resistance mutations spread across clinical and environmental microbiomes."
  description: "Antimicrobial resistance is one of the defining public health challenges of this century. We use comparative genomics, phylogenomics, and evolutionary modelling to understand how resistance determinants emerge, spread, and persist in bacterial populations. We focus on WHO-priority pathogens and track resistance across clinical isolates, livestock microbiomes, and wastewater — asking which genetic and ecological factors most accelerate spread."
  methods:
    - Whole-genome sequencing analysis
    - Phylogenomics
    - Pan-genome analysis
    - Evolutionary modelling
    - Metagenomics
  icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'

- title: "Multi-omics Integration"
  summary: "Connecting transcriptomics, proteomics, and metabolomics to build mechanistic models of stress response with reproducible, open pipelines."
  description: "No single omics layer tells the full story. We develop and apply computational pipelines that integrate transcriptomic, proteomic, and metabolomic data to reconstruct condition-specific regulatory programs. A core commitment is reproducibility: all pipelines are version-controlled, containerised, and benchmarked on public datasets before application to new experimental data. We collaborate with wet-lab groups to co-design experiments that maximise multi-omics interpretability."
  methods:
    - RNA-seq analysis
    - Proteomics data integration
    - Metabolic flux modelling
    - Machine learning
    - Snakemake / Nextflow pipelines
  icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/><line x1="5" y1="19" x2="19" y2="19"/></svg>'

- title: "Molecular Dynamics Simulations"
  summary: "All-atom and coarse-grained MD to understand how oxidative modifications alter protein structure, stability, and interaction networks."
  description: "Oxidative post-translational modifications — disulfide formation, methionine oxidation, carbonylation — can profoundly alter protein function. We use all-atom and coarse-grained molecular dynamics to characterise these structural consequences at atomic resolution, with a focus on redox-sensitive enzymes and chaperones. Long-timescale simulations are run on HPC clusters; analysis pipelines are written in Python using MDAnalysis and MDTraj."
  methods:
    - GROMACS / NAMD simulations
    - Enhanced sampling (metadynamics, REST2)
    - Free energy calculations
    - MDAnalysis / MDTraj
    - Protein structure prediction (AlphaFold2)
