# Teaching data. Drives /teaching/ (layouts/teaching/list.html).
# Each entry in `terms` is one semester: a `heading` and its `courses`.
# Order the list top-to-bottom as you want it to appear on the page.

# Optional lead paragraph above the course list. Empty = not rendered.
intro: ""

terms:
  - heading: "Winter 2026–27"
    courses:
      - code: "PABIT621"
        title: "Computational and Integrative Biology"
        programme: "M.Sc. Biotechnology"
        type: "Theory"
        credits: "3 credits · 45 lecture hours"
        description: >
          A systems view of biology that runs from raw sequence to whole-cell regulation.
          It opens with genomes and the string and graph algorithms behind sequence comparison
          and assembly, including next-generation sequencing. Transcript analysis follows, where
          expression and microarray data are clustered and classified with Bayesian methods,
          support vector machines, and semi-supervised learning, alongside epigenomics and ChIP
          data. Later modules build biological networks from molecular interactions, with
          centrality, community structure, and synthetic biology, then close on integrative cell
          signalling and the regulatory systems that keep cells stable.

  - heading: "Fall 2026–27"
    courses:
      - code: "BBIT327L"
        title: "Data Analytics in Bioinformatics"
        programme: "B.Tech. CSE (Bioinformatics)"
        type: "Theory"
        credits: "3 credits · 45 lecture hours"
        description: >
          Machine learning applied to biological data. The course opens with supervised and
          unsupervised learning, then works through the problems that make omics data awkward:
          high dimensionality, class imbalance, and integration across data levels. Students cover
          dimensionality reduction, gene selection from multi-level omics, random forests for
          imbalanced genomic classification, and optimisation methods for microarray feature
          selection. Later modules move into image segmentation, deep learning for medical imaging
          and diagnostics, and genome signal processing for hotspot identification.

      - code: "BBIT417P"
        title: "Analytical Bioinformatics Lab"
        programme: "B.Tech. CSE (Bioinformatics)"
        type: "Laboratory"
        credits: "1 credit · 30 laboratory hours"
        description: >
          Hands-on sequence and structure analysis. Students retrieve and manage data from the
          major biological databases, then work through pairwise alignment by global, local, and
          dot plot methods before moving to BLAST searches and multiple sequence alignment with
          phylogeny in Clustal Omega. The structural half covers motif and domain searching, the
          PDB, protein secondary structure prediction, and 3D structure visualisation.

# Optional. Shown under a "Student Projects" heading if non-empty.
